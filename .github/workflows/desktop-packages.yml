name: Desktop Packages

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish artifacts to a GitHub Release after packaging.'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Existing tag to publish when manually dispatching, for example v0.1.0.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG
            runner: macos-latest
            rust_targets: aarch64-apple-darwin
            adb_platform: darwin-arm64
            package_command: node scripts/package-tauri.mjs --platform macos --target aarch64-apple-darwin
            artifact_name: okhttp-debug-desktop-macos-arm64
            artifact_paths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Intel DMG
            runner: macos-latest
            rust_targets: x86_64-apple-darwin
            adb_platform: darwin-x64
            package_command: node scripts/package-tauri.mjs --platform macos --target x86_64-apple-darwin
            artifact_name: okhttp-debug-desktop-macos-x64
            artifact_paths: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows NSIS
            runner: windows-2022
            rust_targets: ''
            adb_platform: win32
            package_command: node scripts/package-tauri.mjs --platform windows
            artifact_name: okhttp-debug-desktop-windows
            artifact_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux AppImage and deb
            runner: ubuntu-22.04
            rust_targets: ''
            adb_platform: linux-x64
            package_command: node scripts/package-tauri.mjs --platform linux
            artifact_name: okhttp-debug-desktop-linux-x64
            artifact_paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
            install_linux_dependencies: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies
        if: matrix.install_linux_dependencies == true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libfuse2

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: npm ci --prefer-offline --no-audit

      - name: Fetch Android Platform-Tools
        run: npm run fetch:adb -- --platform ${{ matrix.adb_platform }}

      - name: Package desktop app
        run: ${{ matrix.package_command }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    timeout-minutes: 15

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_TAG_NAME: ${{ github.ref_name }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          IS_MANUAL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          TAG_NAME="$DEFAULT_TAG_NAME"
          if [ "$IS_MANUAL_DISPATCH" = "true" ]; then
            TAG_NAME="$RELEASE_TAG_INPUT"
          fi

          if [ -z "$TAG_NAME" ]; then
            echo "Release tag is empty. Provide release_tag for manual publish runs."
            exit 1
          fi

          find release-assets -maxdepth 3 -type f -print -exec ls -lh {} \;
          mapfile -d '' ASSETS < <(find release-assets -type f -print0)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No release assets were downloaded."
            exit 1
          fi

          if gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" --repo "$GH_REPO" --title "$TAG_NAME" --generate-notes --verify-tag
          fi
